entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  docker:
    network: traefik-network

certificatesResolvers:
  letsencrypt:
    acme:
      email: gayfullin.r.i@yandex.ru
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web
